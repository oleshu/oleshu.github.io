<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#1a1208">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>My Library</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Mono:wght@300;400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1a1208;
    --parchment: #f5f0e8;
    --cream: #ede8dc;
    --gold: #c9952a;
    --gold-light: #e8b84b;
    --rust: #8b3a2a;
    --sage: #4a6741;
    --muted: #7a6e5f;
    --border: #d4c9b0;
    --card: #faf7f2;
    --shadow: rgba(26,18,8,0.15);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--parchment);
    color: var(--ink);
    min-height: 100vh;
    max-width: 480px;
    margin: 0 auto;
    position: relative;
  }

  /* ── HEADER ── */
  header {
    background: var(--ink);
    padding: 18px 20px 14px;
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 {
    font-family: 'Playfair Display', serif;
    font-size: 1.5rem;
    color: var(--gold);
    letter-spacing: 0.02em;
  }
  header span {
    font-family: 'DM Mono', monospace;
    font-size: 0.7rem;
    color: var(--muted);
    letter-spacing: 0.08em;
  }

  /* ── NAV TABS ── */
  nav {
    display: flex;
    background: var(--ink);
    border-top: 1px solid #2e2416;
    padding: 0 20px 12px;
    gap: 6px;
  }
  nav button {
    flex: 1;
    padding: 7px 4px;
    border: 1px solid #3a2e1e;
    border-radius: 6px;
    background: transparent;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.06em;
    cursor: pointer;
    transition: all 0.2s;
    text-transform: uppercase;
  }
  nav button.active {
    background: var(--gold);
    color: var(--ink);
    border-color: var(--gold);
    font-weight: 500;
  }

  /* ── VIEWS ── */
  .view { display: none; padding: 16px; animation: fadeIn 0.2s ease; }
  .view.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  /* ── VOICE INTERFACE ── */
  .voice-panel {
    background: var(--ink);
    border-radius: 12px;
    padding: 35px 20px;
    text-align: center;
    border: 1px solid #3a2e1e;
    margin-bottom: 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
  }
  .lang-selector {
    display: flex;
    gap: 6px;
    background: #23190e;
    padding: 4px;
    border-radius: 20px;
    border: 1px solid #3a2e1e;
  }
  .lang-btn {
    border: none;
    background: transparent;
    color: var(--muted);
    padding: 6px 14px;
    font-size: 0.75rem;
    font-family: 'DM Sans', sans-serif;
    border-radius: 16px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .lang-btn.active {
    background: var(--gold);
    color: var(--ink);
    font-weight: 500;
  }
  .mic-circle {
    width: 84px;
    height: 84px;
    border-radius: 50%;
    background: #23190e;
    border: 2px solid var(--gold);
    color: var(--gold);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.3s;
    outline: none;
    box-shadow: 0 0 0 0 rgba(201, 149, 42, 0.4);
  }
  .mic-circle:active { transform: scale(0.95); }
  .mic-circle.listening {
    background: var(--rust);
    border-color: var(--rust);
    color: #fff;
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(139, 58, 42, 0.6); }
    70% { box-shadow: 0 0 0 15px rgba(139, 58, 42, 0); }
    100% { box-shadow: 0 0 0 0 rgba(139, 58, 42, 0); }
  }
  .voice-status {
    font-size: 0.85rem;
    color: var(--parchment);
    line-height: 1.5;
    min-height: 44px;
    max-width: 85%;
  }

  /* ── BUTTONS ── */
  .btn {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 8px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    margin-bottom: 8px;
  }
  .btn-primary { background: var(--gold); color: var(--ink); }
  .btn-primary:hover { background: var(--gold-light); }
  .btn-secondary { background: var(--cream); color: var(--ink); border: 1px solid var(--border); }
  .btn-danger { background: var(--rust); color: #fff; }

  /* ── FORM ── */
  .form-group { margin-bottom: 13px; }
  label {
    display: block;
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.08em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 5px;
  }
  input[type=text], input[type=number], textarea, select {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: var(--card);
    color: var(--ink);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    outline: none;
    transition: border-color 0.2s;
  }
  input:focus, textarea:focus, select:focus { border-color: var(--gold); }
  textarea { resize: vertical; min-height: 70px; }

  .status-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }
  .status-btn {
    padding: 9px;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: var(--card);
    color: var(--ink);
    font-size: 0.78rem;
    cursor: pointer;
    text-align: center;
    transition: all 0.2s;
  }
  .status-btn.sel-read { background: var(--sage); color: #fff; border-color: var(--sage); }
  .status-btn.sel-started { background: var(--gold); color: var(--ink); border-color: var(--gold); }
  .status-btn.sel-owned { background: var(--ink); color: var(--parchment); border-color: var(--ink); }
  .status-btn.sel-not-owned { background: var(--rust); color: #fff; border-color: var(--rust); }

  /* ── CARD ── */
  .book-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }
  .book-card:hover { border-color: var(--gold); box-shadow: 0 3px 12px var(--shadow); }
  .book-card::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
  }
  .book-card.status-read::before { background: var(--sage); }
  .book-card.status-started::before { background: var(--gold); }
  .book-card.status-owned::before { background: var(--ink); }
  .book-card.status-not-owned::before { background: var(--rust); }

  .book-card h3 {
    font-family: 'Playfair Display', serif;
    font-size: 1rem;
    margin-bottom: 3px;
    padding-right: 60px;
  }
  .book-card .author {
    font-size: 0.8rem;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .book-meta {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
  }
  .badge {
    font-family: 'DM Mono', monospace;
    font-size: 0.6rem;
    letter-spacing: 0.05em;
    padding: 3px 7px;
    border-radius: 4px;
    text-transform: uppercase;
  }
  .badge-read { background: var(--sage); color: #fff; }
  .badge-started { background: var(--gold); color: var(--ink); }
  .badge-owned { background: var(--ink); color: var(--parchment); }
  .badge-not-owned { background: var(--rust); color: #fff; }
  .badge-year { background: var(--cream); color: var(--muted); border: 1px solid var(--border); }

  /* ── LIBRARY FILTERS ── */
  .filter-bar {
    display: flex;
    gap: 6px;
    margin-bottom: 14px;
    overflow-x: auto;
    padding-bottom: 4px;
  }
  .filter-bar::-webkit-scrollbar { display: none; }
  .filter-chip {
    flex-shrink: 0;
    padding: 6px 12px;
    border: 1px solid var(--border);
    border-radius: 20px;
    background: var(--card);
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.05em;
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.2s;
  }
  .filter-chip.active { background: var(--ink); color: var(--gold); border-color: var(--ink); }

  .search-wrap { position: relative; margin-bottom: 12px; }
  .search-wrap input { padding-left: 36px; }
  .search-wrap svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); opacity: 0.4; }

  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--muted);
  }
  .empty-state p { font-size: 0.85rem; line-height: 1.6; }

  /* ── MODAL ── */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(26,18,8,0.7);
    z-index: 200;
    align-items: flex-end;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--parchment);
    border-radius: 16px 16px 0 0;
    padding: 20px;
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
    max-height: 90vh;
    overflow-y: auto;
    animation: slideUp 0.25s ease;
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .modal-handle {
    width: 36px; height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin: 0 auto 16px;
  }
  .modal h2 {
    font-family: 'Playfair Display', serif;
    font-size: 1.3rem;
    margin-bottom: 4px;
  }
  .modal .subtitle {
    font-size: 0.8rem;
    color: var(--muted);
    margin-bottom: 16px;
    font-style: italic;
  }
  .modal .description {
    font-size: 0.85rem;
    line-height: 1.6;
    color: var(--muted);
    margin-bottom: 14px;
    padding: 10px;
    background: var(--cream);
    border-radius: 6px;
    border-left: 3px solid var(--gold);
  }
  .modal .gr-rating {
    font-family: 'DM Mono', monospace;
    font-size: 0.75rem;
    color: var(--gold);
    margin-bottom: 14px;
  }

  /* ── DUPLICATE BANNER ── */
  .duplicate-banner {
    background: var(--rust);
    color: #fff;
    padding: 10px 14px;
    border-radius: 8px;
    margin-bottom: 14px;
    font-size: 0.85rem;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* ── TOAST ── */
  #toast {
    position: fixed;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--ink);
    color: var(--gold);
    padding: 10px 18px;
    border-radius: 20px;
    font-family: 'DM Mono', monospace;
    font-size: 0.75rem;
    opacity: 0;
    transition: all 0.3s;
    z-index: 300;
    white-space: nowrap;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .section-title {
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.1em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  .stat-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 20px;
  }
  .stat-box {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 6px;
    text-align: center;
  }
  .stat-box .num {
    font-family: 'Playfair Display', serif;
    font-size: 1.4rem;
    color: var(--gold);
    display: block;
  }
  .stat-box .lbl {
    font-family: 'DM Mono', monospace;
    font-size: 0.55rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .modal-actions { display: flex; gap: 8px; margin-top: 14px; }
  .modal-actions .btn { margin-bottom: 0; }

  .detail-field { margin-bottom: 10px; }
  .detail-field .lbl {
    font-family: 'DM Mono', monospace;
    font-size: 0.6rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 2px;
  }
  .detail-field .val { font-size: 0.9rem; }
</style>
</head>
<body>

<header>
  <h1>My Library</h1>
  <span id="bookCount">0 books</span>
</header>

<nav>
  <button class="active" onclick="showView('scan')">Voice Add</button>
  <button onclick="showView('library')">Library</button>
  <button onclick="showView('stats')">Stats</button>
</nav>

<div class="view active" id="view-scan">
  <div class="voice-panel">
    <div class="lang-selector">
      <button class="lang-btn active" onclick="setSpeechLang('en-US', this)">🇬🇧 English</button>
      <button class="lang-btn" onclick="setSpeechLang('bg-BG', this)">🇧🇬 Български</button>
    </div>

    <button id="micBtn" class="mic-circle" onclick="startVoiceSearch()">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
        <path d="M19 10v1a7 7 0 0 1-14 0v-1M12 19v3M8 22h8"/>
      </svg>
    </button>
    
    <div id="voiceStatus" class="voice-status">Tap the microphone and speak the book title</div>
  </div>

  <div style="text-align: center; margin: 18px 0; color: var(--muted); font-family: 'DM Mono', monospace; font-size: 0.7rem; letter-spacing:0.05em;">— OR —</div>

  <button class="btn btn-secondary" onclick="openManualAdd()">＋ Type Manually</button>
</div>

<div class="view" id="view-library">
  <div class="search-wrap">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input type="text" id="searchInput" placeholder="Search by title or author…" oninput="renderLibrary()">
  </div>

  <div class="filter-bar">
    <div class="filter-chip active" data-filter="all" onclick="setFilter(this)">All</div>
    <div class="filter-chip" data-filter="read" onclick="setFilter(this)">Read</div>
    <div class="filter-chip" data-filter="started" onclick="setFilter(this)">Started</div>
    <div class="filter-chip" data-filter="owned" onclick="setFilter(this)">Owned</div>
    <div class="filter-chip" data-filter="not-owned" onclick="setFilter(this)">Not Owned</div>
  </div>

  <div id="bookList"></div>
</div>

<div class="view" id="view-stats">
  <p class="section-title">Collection overview</p>
  <div class="stat-row">
    <div class="stat-box"><span class="num" id="s-total">0</span><span class="lbl">Total</span></div>
    <div class="stat-box"><span class="num" id="s-read">0</span><span class="lbl">Read</span></div>
    <div class="stat-box"><span class="num" id="s-owned">0</span><span class="lbl">Owned</span></div>
    <div class="stat-box"><span class="num" id="s-started">0</span><span class="lbl">Started</span></div>
  </div>
  <div id="statsList"></div>

  <div style="margin-top:24px;">
    <p class="section-title">Data</p>
    <button class="btn btn-secondary" onclick="exportCSV()" style="margin-bottom:8px">↓ Export to CSV</button>
    <button class="btn btn-secondary" onclick="document.getElementById('csvFileInput').click()">↑ Import from CSV</button>
    <input type="file" id="csvFileInput" accept=".csv" style="display:none" onchange="importCSV(event)">
  </div>
</div>

<div class="modal-overlay" id="detailModal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div id="detailContent"></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" style="flex:1" onclick="closeModal('detailModal')">Close</button>
      <button class="btn btn-primary" style="flex:1" id="editBtn" onclick="openEditFromDetail()">Edit</button>
      <button class="btn btn-danger" style="flex:0.6" onclick="deleteCurrentBook()">Delete</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="addModal">
  <div class="modal">
    <div class="modal-handle"></div>
    <h2 id="modalTitle">Add Book</h2>
    <div id="duplicateWarning" class="duplicate-banner" style="display:none">📚 Already in library!</div>
    <div id="bookDescription" class="description" style="display:none"></div>
    <div id="bookGRRating" class="gr-rating" style="display:none"></div>

    <div class="form-group"><label>Title *</label><input type="text" id="f-title" placeholder="Book title" oninput="checkDuplicate()"></div>
    <div class="form-group"><label>Author *</label><input type="text" id="f-author" placeholder="Author name"></div>
    <div class="form-group"><label>Publisher</label><input type="text" id="f-publisher" placeholder="Publisher (optional)"></div>
    <div class="form-group"><label>Year</label><input type="number" id="f-year" placeholder="Year" min="1000" max="2099"></div>
    <div class="form-group"><label>Notes</label><textarea id="f-notes" placeholder="Your notes…"></textarea></div>
    <div class="form-group">
      <label>Status</label>
      <div class="status-grid">
        <div class="status-btn" data-status="read" onclick="selectStatus(this)">✓ Read</div>
        <div class="status-btn" data-status="started" onclick="selectStatus(this)">▷ Started</div>
        <div class="status-btn" data-status="owned" onclick="selectStatus(this)">📚 Owned</div>
        <div class="status-btn" data-status="not-owned" onclick="selectStatus(this)">○ Not Owned</div>
      </div>
    </div>
    <div style="display:flex;gap:8px;margin-top:6px;">
      <button class="btn btn-secondary" style="flex:1" onclick="closeModal('addModal')">Cancel</button>
      <button class="btn btn-primary" style="flex:1" onclick="saveBook()">Save Book</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
let db;
let currentFilter = 'all';
let editingId = null;
let currentDetailId = null;
let recognition = null;
let currentSpeechLang = 'en-US';

function openDB() {
  return new Promise((res, rej) => {
    const req = indexedDB.open('mylibrary', 1);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains('books')) {
        const store = d.createObjectStore('books', { keyPath: 'id', autoIncrement: true });
        store.createIndex('title', 'title', { unique: false });
      }
    };
    req.onsuccess = e => { db = e.target.result; res(db); };
    req.onerror = () => rej(req.error);
  });
}

function dbAll() {
  return new Promise((res, rej) => {
    const tx = db.transaction('books', 'readonly');
    const req = tx.objectStore('books').getAll();
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error);
  });
}
function dbAdd(book) {
  return new Promise((res, rej) => {
    const tx = db.transaction('books', 'readwrite');
    const req = tx.objectStore('books').add(book);
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error);
  });
}
function dbPut(book) {
  return new Promise((res, rej) => {
    const tx = db.transaction('books', 'readwrite');
    const req = tx.objectStore('books').put(book);
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error);
  });
}
function dbDelete(id) {
  return new Promise((res, rej) => {
    const tx = db.transaction('books', 'readwrite');
    const req = tx.objectStore('books').delete(id);
    req.onsuccess = () => res();
    req.onerror = () => rej(req.error);
  });
}

function showView(name) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  document.getElementById('view-' + name).classList.add('active');
  if (event && event.target) event.target.classList.add('active');
  if (name === 'library') renderLibrary();
  if (name === 'stats') renderStats();
}

// ══════════════════════════════════
//  SPEECH TO TEXT CODE
// ══════════════════════════════════
function initSpeech() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    setVoiceStatus('❌ Speech recognition not supported on this browser context.');
    return null;
  }
  const recog = new SpeechRecognition();
  recog.continuous = false;
  recog.interimResults = false;
  
  recog.onstart = () => {
    setVoiceStatus('🎙️ Listening... Say the book title.');
    document.getElementById('micBtn').classList.add('listening');
  };
  
  recog.onerror = (e) => {
    if (e.error === 'not-allowed') {
      setVoiceStatus('⚠️ Mic permission denied. Enable mic in settings.');
    } else {
      setVoiceStatus('⚠️ Voice processing timed out or failed.');
    }
  };
  
  recog.onend = () => {
    document.getElementById('micBtn').classList.remove('listening');
  };
  
  recog.onresult = async (event) => {
    const text = event.results[0][0].transcript;
    setVoiceStatus(`✨ Captured: "${text}"<br><span class="loader"></span> Querying Open Library…`);
    await searchOpenLibrary(text);
  };
  
  return recog;
}

function startVoiceSearch() {
  if (!recognition) recognition = initSpeech();
  if (!recognition) return;
  
  recognition.lang = currentSpeechLang;
  try {
    recognition.start();
  } catch(e) {
    // Session running
  }
}

function setSpeechLang(lang, btn) {

  document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  setVoiceStatus(`Ready to listen in ${lang === 'bg-BG' ? 'Bulgarian' : 'English'}`);
}

function setVoiceStatus(html) {

}

async function searchOpenLibrary(query) {
  try {
    const url = `https://openlibrary.org/search.json?q=${encodeURIComponent(query)}&limit=1&fields=title,author_name,publisher,first_publish_year,description,ratings_average,ratings_count,key`;
    const res = await fetch(url);
    const data = await res.json();

    if (data.docs && data.docs.length > 0) {
      const book = data.docs[0];
      const title = book.title || '';
      const author = (book.author_name || []).join(', ');
      const publisher = (book.publisher || [])[0] || '';
      const year = book.first_publish_year || '';
      const rating = book.ratings_average ? book.ratings_average.toFixed(1) : null;
      const ratingsCount = book.ratings_count || 0;

      let description = '';
      if (book.key) {
        try {
          const workRes = await fetch(`https://openlibrary.org${book.key}.json`);
          const workData = await workRes.json();
          if (workData.description) {
            const raw = typeof workData.description === 'string' ? workData.description : workData.description.value || '';
            description = raw.split(/(?<=[.!?])\s+/).slice(0, 3).join(' ');
          }
        } catch (_) {}
      }

      setVoiceStatus('✓ Book identified!');
      openAddModal({ title, author, publisher, year: String(year), description, rating, ratingsCount });
    } else {
      setVoiceStatus('⚠ No precise online match found. Opening form for adjustments.');
      openAddModal({ title: query });
    }
  } catch (e) {
    setVoiceStatus('⚠ Network timeout. Opening layout manually.');
    openAddModal({ title: query });
  }
}

function openManualAdd() {
  editingId = null;
  openAddModal({});
}

function openAddModal(data) {
  editingId = null;
  document.getElementById('modalTitle').textContent = 'Add Book';
  document.getElementById('f-title').value = data.title || '';
  document.getElementById('f-author').value = data.author || '';
  document.getElementById('f-publisher').value = data.publisher || '';
  document.getElementById('f-year').value = data.year || '';
  document.getElementById('f-notes').value = data.notes || '';

  const descEl = document.getElementById('bookDescription');
  if (data.description) { descEl.textContent = data.description; descEl.style.display = 'block'; } else { descEl.style.display = 'none'; }

  const ratingEl = document.getElementById('bookGRRating');
  if (data.rating) {
    ratingEl.innerHTML = `★ ${data.rating} / 5 · ${data.ratingsCount?.toLocaleString() || 0} ratings on Open Library`;
    ratingEl.style.display = 'block';
  } else {
    ratingEl.style.display = 'none';
  }

  document.querySelectorAll('.status-btn').forEach(b => b.className = 'status-btn');
  const initialStatus = data.status || 'owned';
  const btn = document.querySelector(`.status-btn[data-status="${initialStatus}"]`);
  if (btn) btn.classList.add('sel-' + initialStatus.replace('-',''));

  document.getElementById('duplicateWarning').style.display = 'none';
  checkDuplicate();
  document.getElementById('addModal').classList.add('open');
}

async function openEditModal(book) {
  editingId = book.id;
  document.getElementById('modalTitle').textContent = 'Edit Book';
  document.getElementById('f-title').value = book.title || '';
  document.getElementById('f-author').value = book.author || '';
  document.getElementById('f-publisher').value = book.publisher || '';
  document.getElementById('f-year').value = book.year || '';
  document.getElementById('f-notes').value = book.notes || '';

  document.getElementById('bookDescription').style.display = 'none';
  document.getElementById('bookGRRating').style.display = 'none';
  document.getElementById('duplicateWarning').style.display = 'none';

  document.querySelectorAll('.status-btn').forEach(b => b.className = 'status-btn');

    const btn = document.querySelector(`.status-btn[data-status="${book.status}"]`);

function selectStatus(el) {
  document.querySelectorAll('.status-btn').forEach(b => b.className = 'status-btn');
  const s = el.dataset.status;
  el.classList.add('sel-' + s.replace('-',''));
}

function getSelectedStatus() {
  const sel = document.querySelector('.status-btn[class*="sel-"]');
  return sel ? sel.dataset.status : 'owned';
}

async function checkDuplicate() {
  if (editingId) return;
  const title = document.getElementById('f-title').value.trim().toLowerCase();
  if (title.length < 2) { document.getElementById('duplicateWarning').style.display = 'none'; return; }
  const books = await dbAll();
  const dup = books.find(b => normalize(b.title) === normalize(title));
  document.getElementById('duplicateWarning').style.display = dup ? 'flex' : 'none';
}

function normalize(s) {
  return (s || '').toLowerCase().replace(/[^a-z0-9]/g, '');
}

async function saveBook() {
  const title = document.getElementById('f-title').value.trim();
  const author = document.getElementById('f-author').value.trim();
  if (!title) { showToast('Title is required'); return; }

  const book = {
    title, author,
    publisher: document.getElementById('f-publisher').value.trim(),
    year: document.getElementById('f-year').value.trim(),
    notes: document.getElementById('f-notes').value.trim(),
    status: getSelectedStatus(),
    addedAt: editingId ? undefined : Date.now()
  };

  if (editingId) {
    book.id = editingId;
    await dbPut(book);
    showToast('Book updated');
  } else {
    await dbAdd(book);
    showToast('Book added to library');
  }

  closeModal('addModal');
  renderLibrary();
  updateCount();
  setVoiceStatus('Tap the microphone and speak the book title');
}

function openDetailModal(book) {
  currentDetailId = book.id;
  const statusLabels = { read: '✓ Read', started: '▷ Started', owned: '📚 Owned', 'not-owned': '○ Not Owned' };
  document.getElementById('detailContent').innerHTML = `
    <h2>${book.title}</h2>
    <p class="subtitle">${book.author || 'Unknown author'}</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;">
      <span class="badge badge-${book.status}">${statusLabels[book.status] || book.status}</span>
      ${book.year ? `<span class="badge badge-year">${book.year}</span>` : ''}

    ${book.publisher ? `<div class="detail-field"><div class="lbl">Publisher</div><div class="val">${book.publisher}</div></div>` : ''}
    ${book.notes ? `<div class="detail-field"><div class="lbl">Notes</div><div class="val">${book.notes}</div></div>` : ''}

}

async function openEditFromDetail() {
  const books = await dbAll();
  const book = books.find(b => b.id === currentDetailId);
  if (book) { closeModal('detailModal'); openEditModal(book); }
}

async function deleteCurrentBook() {
  if (!confirm('Delete this book?')) return;
  await dbDelete(currentDetailId);
  closeModal('detailModal');
  renderLibrary();
  renderStats();
  updateCount();
  showToast('Book deleted');
}

function closeModal(id) {
  document.getElementById(id).classList.remove('open');
}

function setFilter(el) {
  document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  currentFilter = el.dataset.filter;
  renderLibrary();
}

async function renderLibrary() {
  const books = await dbAll();
  const query = normalize(document.getElementById('searchInput').value);
  const list = document.getElementById('bookList');

  let filtered = books.filter(b => {
    const matchFilter = currentFilter === 'all' || b.status === currentFilter;
    const matchSearch = !query || normalize(b.title).includes(query) || normalize(b.author).includes(query);
    return matchFilter && matchSearch;
  });

  filtered.sort((a, b) => (a.title || '').localeCompare(b.title || ''));

  if (filtered.length === 0) {
    list.innerHTML = `<div class="empty-state"><p>No books found.</p></div>`;
    return;
  }

  const statusLabels = { read: '✓ Read', started: '▷ Started', owned: '📚 Owned', 'not-owned': '○ Not Owned' };

  list.innerHTML = filtered.map(b => `
    <div class="book-card status-${b.status}" onclick='openDetailModal(${JSON.stringify(b)})'>
      <h3>${b.title}</h3>
      <div class="author">${b.author || '<em>Unknown author</em>'}</div>
      <div class="book-meta">
        <span class="badge badge-${b.status}">${statusLabels[b.status] || b.status}</span>
        ${b.year ? `<span class="badge badge-year">${b.year}</span>` : ''}
      </div>
    </div>
  `).join('');
}

async function renderStats() {
  const books = await dbAll();
  document.getElementById('s-total').textContent = books.length;
  document.getElementById('s-read').textContent = books.filter(b => b.status === 'read').length;
  document.getElementById('s-owned').textContent = books.filter(b => b.status === 'owned').length;
  document.getElementById('s-started').textContent = books.filter(b => b.status === 'started').length;

  const authorCount = {};
  books.forEach(b => { if (b.author) authorCount[b.author] = (authorCount[b.author] || 0) + 1; });
  const topAuthors = Object.entries(authorCount).sort((a,b) => b[1]-a[1]).slice(0,5);

  document.getElementById('statsList').innerHTML = topAuthors.length ? `
    <p class="section-title" style="margin-top:10px">Top authors</p>
    ${topAuthors.map(([a, c]) => `
      <div style="display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border)">
        <span style="font-size:0.85rem">${a}</span>
        <span style="font-family:'DM Mono',monospace;font-size:0.75rem;color:var(--gold)">${c} book${c>1?'s':''}</span>
      </div>
    `).join('')}
  ` : '';
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

async function updateCount() {
  const books = await dbAll();
  document.getElementById('bookCount').textContent = `${books.length} book${books.length !== 1 ? 's' : ''}`;
}
